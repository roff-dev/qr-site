<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found – Kieron Oates</title>
<meta name="description" content="This page doesn't exist. Go to Kieron Oates' homepage for his portfolio and projects.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ECEFF3">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #ECEFF3;
  --ink: #14171D;
  --muted: #4E5563;
  --accent: #2340D0;
  --gutter: max(1rem, env(safe-area-inset-left), env(safe-area-inset-right));
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 34rem;
  margin: 0 auto;
  padding:
    max(2.75rem, calc(env(safe-area-inset-top) + 1.5rem))
    var(--gutter)
    max(2.5rem, calc(env(safe-area-inset-bottom) + 1.5rem));
}
h1 {
  margin: 0;
  font-size: clamp(2.25rem, 9vw + 0.25rem, 3rem);
  line-height: 1.02;
  font-weight: 750;
  letter-spacing: -0.035em;
}
p { margin: 1.25rem 0 2rem; color: var(--muted); }
a {
  display: inline-flex;
  align-items: center;
  min-height: 52px;
  padding: 0 1.5rem;
  border-radius: 14px;
  background: var(--accent);
  color: #FFFFFF;
  font-weight: 650;
  text-decoration: none;
  transition: transform 120ms ease-out;
}
a:active { transform: scale(0.97); background: #1C34AE; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (hover: hover) { a:hover { background: #1C34AE; } }
@media (prefers-reduced-motion: reduce) {
  a { transition: none; }
  a:active { transform: none; }
}
@media (min-width: 40rem) { main { padding-top: 5rem; } }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn't exist. My portfolio and projects are on the homepage.</p>
  <a href="/">Go to the homepage</a>
</main>
</body>
</html>
